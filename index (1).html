<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CrackTheEgg</title>
<style>
  :root {
    --stout: #16110d; --foam: #f3ead8; --shell: #d9b382; --amber: #f2a51a; --dim: #3a2f26;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; background: var(--stout); color: var(--foam);
    font-family: ui-rounded, "SF Pro Rounded", "Arial Rounded MT Bold", system-ui, sans-serif; }
  body { display: flex; flex-direction: column; padding: env(safe-area-inset-top) 20px calc(env(safe-area-inset-bottom) + 20px); }
  [hidden] { display: none !important; }

  #msg { margin: auto; text-align: center; font-size: 1.4rem; line-height: 1.4; max-width: 18em; }

  /* join */
  #join { margin: auto 0; display: flex; flex-direction: column; gap: 18px; }
  #nick { font: inherit; font-size: 1.4rem; padding: 14px 16px; border-radius: 14px; border: 2px solid var(--dim);
    background: transparent; color: var(--foam); }
  #nick:focus-visible { outline: 3px solid var(--amber); border-color: transparent; }
  #avatars { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  #avatars button { font-size: 2rem; padding: 10px 0; border-radius: 14px; border: 2px solid var(--dim); background: transparent; }
  #avatars button[aria-pressed="true"] { border-color: var(--amber); background: var(--dim); }
  #jerr, #err { min-height: 1.2em; color: #ff8a70; text-align: center; margin: 0; }

  /* play */
  #play { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding-top: 24px; }
  #eggwrap { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; min-height: 0; }
  #egg { max-width: 70vw; max-height: 45vh; object-fit: contain; }
  #eggfb { font-size: 9rem; line-height: 1; }
  #hp { font-size: 1.6rem; color: var(--shell); }
  #tap { width: 100%; font: inherit; font-size: 2rem; font-weight: 700; padding: 30px 0; border: 0; border-radius: 28px;
    background: var(--amber); color: var(--stout); touch-action: manipulation; }
  #tap:not(:disabled) { animation: breathe 1.6s ease-in-out infinite; }
  #tap:active:not(:disabled) { transform: scale(.97); }
  #tap:disabled { background: var(--dim); color: #8a7a6a; }
  #tap:focus-visible { outline: 3px solid var(--foam); outline-offset: 3px; }
  @keyframes breathe { 50% { box-shadow: 0 0 0 10px rgba(242,165,26,.22); } }
  @media (prefers-reduced-motion: reduce) { #tap:not(:disabled) { animation: none; } }
</style>
</head>
<body>
  <p id="msg">Scan the QR code on the TV to join.</p>

  <section id="join" hidden>
    <input id="nick" maxlength="14" placeholder="Your nickname" autocomplete="off" aria-label="Nickname">
    <div id="avatars" role="group" aria-label="Pick an avatar"></div>
    <p id="jerr" role="alert"></p>
    <button id="tap-join" class="go" style="font:inherit;font-size:1.6rem;font-weight:700;padding:22px 0;border:0;border-radius:22px;background:var(--amber);color:var(--stout)">Join game</button>
  </section>

  <section id="play" hidden>
    <div id="eggwrap">
      <img id="egg" alt="Your egg">
      <div id="eggfb" hidden>🥚</div>
      <div id="hp"></div>
    </div>
    <p id="err" role="alert"></p>
    <button id="tap" disabled>Wait for your turn</button>
  </section>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const $ = id => document.getElementById(id);
const gameId = new URLSearchParams(location.search).get("game");
const AVATARS = ["🦊","🐸","🐙","🦄","🐼","🐯","🦖","🐧","🦉","🐝","🦁","🐨"];
const SAVED = "cte_player_" + gameId;
let db, game = null, me = null, busy = false, chosen = null, wasTurn = false;

const show = id => ["msg", "join", "play"].forEach(s => $(s).hidden = s !== id);
const say = t => { $("msg").textContent = t; show("msg"); };
// hp > 5 -> 0, 4-5 -> 1, 2-3 -> 2, 1 -> 3, below 1 -> 4
const stage = hp => hp > 5 ? 0 : hp > 3 ? 1 : hp > 1 ? 2 : hp === 1 ? 3 : 4;

function render() {
  if (!game) return;
  if (!me) return show("join");
  if (me.status === "spectator") return say("A game is in progress. You're in the next one.");
  if (me.status === "lobby") return say(game.phase === "reveal" ? "Get ready…" : "Waiting for the host to start…");

  const hp = Math.max(me.egg_hp ?? 0, 0);
  const src = `assets/eggsimg/egg_${stage(hp)}.PNG`;
  if (!$("egg").src.endsWith(src)) $("egg").src = src;
  $("hp").textContent = hp + " HP";

  const myTurn = game.phase === "playing" && me.status === "alive" && game.turn_pos === me.turn_pos;
  $("tap").disabled = !myTurn || busy;
  $("tap").textContent = myTurn ? "Tap" : (me.status === "eliminated" ? "Your egg is cracked" : "Wait for your turn");
  if (myTurn && !wasTurn && navigator.vibrate) navigator.vibrate(200);
  wasTurn = myTurn;
  show("play");
}

async function load() {
  const g = await db.from("games").select("*").eq("id", gameId).maybeSingle();
  game = g.data;
  if (!game) return say("Game not found. Scan the QR code again.");
  const pid = localStorage.getItem(SAVED);
  me = null;
  if (pid) {
    const p = await db.from("players").select("*").eq("id", pid).maybeSingle();
    me = p.data;
    if (!me) localStorage.removeItem(SAVED);
  }
  render();
}

function start() {
  if (!gameId) return;
  if (!window.CTE || !window.supabase) { say("Could not load config.js or the Supabase library."); return; }
  db = supabase.createClient(window.CTE.url, window.CTE.key);

  AVATARS.forEach(a => {
    const b = document.createElement("button");
    b.textContent = a; b.setAttribute("aria-pressed", "false");
    b.onclick = () => { chosen = a; [...$("avatars").children].forEach(c => c.setAttribute("aria-pressed", String(c === b))); };
    $("avatars").appendChild(b);
  });

  $("tap-join").onclick = async () => {
    $("jerr").textContent = "";
    if (!chosen) return ($("jerr").textContent = "Pick an avatar.");
    const r = await db.rpc("join_game", { p_game_id: gameId, p_nickname: $("nick").value, p_avatar: chosen });
    if (r.error) return ($("jerr").textContent = r.error.message);
    localStorage.setItem(SAVED, r.data);
    load();
  };

  $("egg").onerror = () => { $("egg").hidden = true; $("eggfb").hidden = false; };
  $("egg").onload  = () => { $("egg").hidden = false; $("eggfb").hidden = true; };

  $("tap").onclick = async () => {
    busy = true; render();
    $("err").textContent = "";
    const r = await db.rpc("tap", { p_game_id: gameId, p_player_id: me.id });
    if (r.error) $("err").textContent = r.error.message;
    await load();
    setTimeout(() => { busy = false; render(); }, 1200);   // matches the 1 s gap between taps on the server
  };

  db.channel("cte-" + gameId)
    .on("postgres_changes", { event: "*", schema: "public", table: "games", filter: `id=eq.${gameId}` },
        p => { if (p.new && p.new.id) { game = p.new; render(); } })
    .on("postgres_changes", { event: "*", schema: "public", table: "players", filter: `game_id=eq.${gameId}` },
        p => {
          const row = (p.new && p.new.id) ? p.new : p.old;
          if (me && row && row.id === me.id) {
            me = (p.new && p.new.id) ? p.new : null;
            if (!me) localStorage.removeItem(SAVED);
            render();
          }
        })
    .subscribe();

  setInterval(load, 5000);                                  // safety net for dropped connections
  document.addEventListener("visibilitychange", () => { if (!document.hidden) load(); });
  load();
}
start();
</script>
</body>
</html>
